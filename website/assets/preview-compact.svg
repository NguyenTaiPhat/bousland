<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="compBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E1B2E" />
      <stop offset="60%" stop-color="#0E0D14" />
      <stop offset="100%" stop-color="#07060A" />
    </radialGradient>
    <linearGradient id="islandBody" x1="160" y1="20" x2="440" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#0D0D14" />
    </linearGradient>
    <linearGradient id="islandBorder" x1="160" y1="20" x2="440" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="islandGlow" x="120" y="0" width="360" height="110" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8B5CF6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Desktop Screen Background -->
  <rect width="600" height="340" rx="16" fill="url(#compBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Subtle Bezel Top Bar -->
  <line x1="0" y1="1" x2="600" y2="1" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- The Compact Dynamic Island -->
  <g filter="url(#islandGlow)">
    <rect x="160" y="16" width="280" height="44" rx="22" fill="url(#islandBody)" stroke="url(#islandBorder)" stroke-width="1" />
  </g>

  <!-- Left: Logo & Name -->
  <g transform="translate(176, 28)">
    <!-- Mini Logo -->
    <rect x="0" y="2" width="24" height="16" rx="8" fill="#1C1C26" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <rect x="5" y="6" width="14" height="8" rx="4" fill="url(#islandBorder)" />
    <!-- Name -->
    <text x="32" y="15" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="-0.01em">BousLand PC</text>
  </g>

  <!-- Right: Indicators (CPU & Battery) -->
  <g transform="translate(345, 28)">
    <!-- CPU Badge -->
    <rect x="0" y="2" width="40" height="16" rx="4" fill="rgba(255,255,255,0.06)" />
    <circle cx="8" cy="10" r="3" fill="#38BDF8" />
    <text x="15" y="14" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">12%</text>

    <!-- Battery Badge -->
    <rect x="46" y="2" width="38" height="16" rx="4" fill="rgba(52,211,153,0.12)" />
    <rect x="52" y="6" width="14" height="8" rx="2" fill="none" stroke="#34D399" stroke-width="1" />
    <rect x="54" y="8" width="8" height="4" rx="1" fill="#34D399" />
    <text x="69" y="14" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">95%</text>
  </g>

  <!-- Desktop Mockup Content below -->
  <circle cx="300" cy="180" r="40" fill="none" stroke="rgba(167,139,250,0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="300" y="245" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Chế độ Compact: Tinh tế, không che khuất không gian làm việc</text>
</svg>
