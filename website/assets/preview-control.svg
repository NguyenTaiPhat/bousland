<svg width="600" height="420" viewBox="0 0 600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ctrlBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1B192A" />
      <stop offset="60%" stop-color="#0E0D14" />
      <stop offset="100%" stop-color="#07060A" />
    </radialGradient>
    <linearGradient id="cardBody" x1="80" y1="20" x2="520" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1C2B" />
      <stop offset="100%" stop-color="#111018" />
    </linearGradient>
    <filter id="ctrlGlow" x="50" y="10" width="500" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8B5CF6" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="420" rx="16" fill="url(#ctrlBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Control Center Window -->
  <g filter="url(#ctrlGlow)">
    <rect x="80" y="20" width="440" height="370" rx="20" fill="url(#cardBody)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  </g>

  <!-- Header -->
  <g transform="translate(104, 40)">
    <text x="0" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Chào buổi sáng</text>
    <text x="0" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Thứ Bảy, 26 tháng 9</text>
    <text x="350" y="24" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="18" font-weight="800">09:41</text>
  </g>

  <!-- 3 Quick Metrics Cards -->
  <g transform="translate(104, 90)">
    <!-- CPU Card -->
    <rect x="0" y="0" width="122" height="74" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CPU LOAD</text>
    <text x="14" y="52" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">18%</text>

    <!-- RAM Card -->
    <rect x="134" y="0" width="122" height="74" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <text x="148" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RAM USAGE</text>
    <text x="148" y="52" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="20" font-weight="800">42%</text>

    <!-- Battery Card -->
    <rect x="268" y="0" width="124" height="74" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <text x="282" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BATTERY</text>
    <text x="282" y="52" fill="#34D399" font-family="system-ui, sans-serif" font-size="20" font-weight="800">95%</text>
  </g>

  <!-- Volume Slider Card -->
  <g transform="translate(104, 180)">
    <rect x="0" y="0" width="392" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="24" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Âm lượng hệ thống (Speakers)</text>
    <text x="350" y="24" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="12" font-weight="700">75%</text>
    <!-- Slider Track -->
    <rect x="16" y="36" width="360" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="16" y="36" width="270" height="8" rx="4" fill="linear-gradient(90deg, #38BDF8, #8B5CF6)" />
    <circle cx="286" cy="40" r="8" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
  </g>

  <!-- Quick Action Pills -->
  <g transform="translate(104, 255)">
    <!-- Camera Button -->
    <rect x="0" y="0" width="124" height="42" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <path d="M16 23C16 21.8954 16.8954 21 18 21H20L21 19H25L26 21H28C29.1046 21 30 21.8954 30 23V29C30 30.1046 29.1046 31 28 31H18C16.8954 31 16 30.1046 16 29V23Z" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="23" cy="26" r="2.5" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <text x="36" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Chụp ảnh</text>

    <!-- Clipboard Button -->
    <rect x="134" y="0" width="124" height="42" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <rect x="148" y="21" width="12" height="12" rx="2" fill="none" stroke="#A78BFA" stroke-width="1.5" />
    <path d="M152 19H156" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" />
    <text x="168" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Khay tạm</text>

    <!-- Settings Button -->
    <rect x="268" y="0" width="124" height="42" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <circle cx="282" cy="25" r="4.5" fill="none" stroke="#34D399" stroke-width="1.5" />
    <path d="M282 18V20M282 30V32M275 25H277M287 25H289" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" />
    <text x="298" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cài đặt</text>
  </g>

  <!-- Footer hint -->
  <text x="300" y="350" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Trung tâm điều khiển: Mọi thao tác nhanh chỉ với 1 cú click</text>
</svg>
