<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shelfBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1B192A" />
      <stop offset="60%" stop-color="#0E0D14" />
      <stop offset="100%" stop-color="#07060A" />
    </radialGradient>
    <linearGradient id="shelfBody" x1="80" y1="20" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1C2B" />
      <stop offset="100%" stop-color="#111018" />
    </linearGradient>
    <filter id="shelfGlow" x="50" y="10" width="500" height="320" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#shelfBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <g filter="url(#shelfGlow)">
    <rect x="80" y="20" width="440" height="290" rx="20" fill="url(#shelfBody)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  </g>

  <!-- Header -->
  <g transform="translate(104, 40)">
    <text x="0" y="20" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Quick Shelf — Tệp tạm thời</text>
    <rect x="220" y="6" width="54" height="20" rx="10" fill="rgba(56,189,248,0.15)" />
    <text x="232" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3 tệp</text>
  </g>

  <!-- Drag Drop Zone -->
  <g transform="translate(104, 80)">
    <rect x="0" y="0" width="392" height="70" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" stroke-dasharray="6 6" />
    <text x="196" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Kéo &amp; Thả tệp bất kỳ vào đây để lưu tạm</text>
    <text x="196" y="50" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ảnh chụp màn hình, tệp tài liệu, code script không làm rác Desktop</text>
  </g>

  <!-- File items list -->
  <g transform="translate(104, 165)">
    <!-- Item 1: Document -->
    <rect x="0" y="0" width="392" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <path d="M14 14H24L28 18V28H14V14Z" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M24 14V18H28" stroke="#38BDF8" stroke-width="1.5" />
    <text x="36" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="500">contract_spec_final.pdf</text>
    <text x="330" y="26" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">2.4 MB</text>

    <!-- Item 2: Image -->
    <rect x="0" y="50" width="392" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <rect x="14" y="64" width="14" height="14" rx="2" fill="none" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="18" cy="68" r="1.5" fill="#A78BFA" />
    <path d="M15 76L19 72L23 75L27 70" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" />
    <text x="36" y="76" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="500">screenshot_2026-09-26.png</text>
    <text x="330" y="76" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">1.1 MB</text>
  </g>

  <text x="300" y="295" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Nhấp đúp để mở file hoặc sao chép đường dẫn trực tiếp</text>
</svg>
